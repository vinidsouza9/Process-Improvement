  <header class="masthead">

  <section class="block" id="root-cause">

    <h2>Five reasonable decisions, one bottleneck</h2>
    <div class="feature-row">
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">

        <p>Only shared time: lunch. Fixed at 75 minutes.</p>
      </div>

        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">

        </svg>

        <p>One flat-rate booking. Budget covers 1 photographer.</p>
      </div>

        <svg class="feature-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>

    <h2>From observed effect to root cause</h2>
    <div class="outline">
      <div class="outline-step" style="--i:0">
        <p class="outline-tag">Observed</p>
        <p class="outline-text">141 students got headshots from one photographer that day.</p>
      </div>
      <div class="outline-step" style="--i:1">
        <p class="outline-tag">Why?</p>
        <p class="outline-text">Fitting all of them into the posted 75 min implies ~32 sec/person.</p>
      </div>
      <div class="outline-step" style="--i:2">
        <p class="outline-tag">Why?</p>
        <p class="outline-text">A real no-review booth realistically runs 45–90 sec per person.</p>
      </div>
      <div class="outline-step" style="--i:3">
        <p class="outline-tag">Why?</p>
        <p class="outline-text">At that pace, 141 people take roughly 105–210 minutes to serve.</p>
      </div>
      <div class="outline-step" style="--i:4">
        <p class="outline-tag">Why?</p>
        <p class="outline-text">So the shoot most likely ran well past its posted 1:30 end time.</p>
      </div>
      <div class="outline-step root" style="--i:5">
        <p class="outline-tag">Root cause</p>
        <p class="outline-text">A 75-minute, one-photographer plan was never enough time for 141 people.</p>
      </div>
    </div>
    <p class="figcaption">
      <b>What it shows:</b> 141 people at a realistic pace needs closer to two
      hours than 75 minutes. The simulation below plays that out minute by
      minute.
    </p>
  </section>

    <p class="sim-lede">

      (60–90 sec) in every panel; only the arrival pattern and photographer
      count change. Press play and watch the queue.
    </p>
    <button id="simPlay" class="sim-btn" type="button">▶ Run simulation</button>
    <noscript>
      <p class="sim-stat">
        (Interactive simulation requires JavaScript.) Current: 1 photographer,
        everyone arrives at once. 81 of 141 are still waiting when lunch ends,
        and the last headshot happens at minute 178. Batching only: the same 1
        photographer, with staggered arrivals. 82 are still waiting at minute
        75, nearly the same backlog, but the average wait drops from about 69
        to about 48 minutes. Solution: 2 photographers. Only 21 are waiting at
        minute 75, and the last headshot happens at minute 89.
      </p>
    </noscript>
    <div class="sim-grid">

(function(){
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20260829);
  var N = 141, WINDOW = 75, ANIM_MAX = 110;

  var serviceTimes = [];
  for (var i=0;i<N;i++) serviceTimes.push(1.0 + rand()*0.5);

  function burstyTime(){ return WINDOW * Math.pow(rand(), 2.3); }
  function uniformTime(){ return WINDOW * rand(); }

  var burstyArr = []; for (i=0;i<N;i++) burstyArr.push(burstyTime()); burstyArr.sort(function(a,b){return a-b;});
  var uniformArr = []; for (i=0;i<N;i++) uniformArr.push(uniformTime()); uniformArr.sort(function(a,b){return a-b;});

  function simulate(arrivals, service, servers){
    var free = []; for (var s=0;s<servers;s++) free.push(0);
    var out = [];
    for (var j=0;j<arrivals.length;j++){
      var idx = 0;
      for (s=1;s<servers;s++) if (free[s] < free[idx]) idx = s;
      var arr = arrivals[j];
      var start = Math.max(arr, free[idx]);
      var finish = start + service[j];
      free[idx] = finish;
      out.push({arrival:arr, start:start, finish:finish});
    }
    return out;
  }

  var scenarios = {
    current:  { data: simulate(burstyArr, serviceTimes, 1), servers:1, color:'sc1' },
    batched:  { data: simulate(uniformArr, serviceTimes, 1), servers:1, color:'sc2' },
    capacity: { data: simulate(burstyArr, serviceTimes, 2), servers:2, color:'good' }
  };

  function countArrived(d,t){ var c=0; for (var i=0;i<d.length;i++) if (d[i].arrival<=t) c++; return c; }
  function countWaiting(d,t){ var c=0; for (var i=0;i<d.length;i++) if (d[i].arrival<=t && d[i].start>t) c++; return c; }
  function countInService(d,t){ var c=0; for (var i=0;i<d.length;i++) if (d[i].start<=t && d[i].finish>t) c++; return c; }
  function countServed(d,t){ var c=0; for (var i=0;i<d.length;i++) if (d[i].finish<=t) c++; return c; }

  var CHART_DT = 0.5, maxW = 0;
  Object.keys(scenarios).forEach(function(k){
    var d = scenarios[k].data, series = [];
    for (var t=0;t<=ANIM_MAX;t+=CHART_DT){
      var w = countWaiting(d,t);
      series.push(w);
      if (w>maxW) maxW = w;
    }
    scenarios[k].series = series;
  });
  maxW = Math.ceil((maxW*1.15)/10)*10;

  var css = getComputedStyle(document.documentElement);
  function cvar(name){ return css.getPropertyValue(name).trim(); }
  var COL = { ink:cvar('--ink'), sub:cvar('--sub'), card:cvar('--card'), line:cvar('--line'),

  var MONO = "10px 'IBM Plex Mono',ui-monospace,monospace";
  var SANS = "10px 'IBM Plex Sans',-apple-system,sans-serif";

  var LW = 460, LH = 250;
  var canvases = {};
  Array.prototype.forEach.call(document.querySelectorAll('.sim-canvas'), function(cv){
    var key = cv.getAttribute('data-key');
    var dpr = window.devicePixelRatio || 1;
    cv.width = LW*dpr; cv.height = LH*dpr;
    var ctx = cv.getContext('2d');
    ctx.scale(dpr,dpr);
    canvases[key] = ctx;
  });

  function drawPanel(ctx, key, t){
    var sc = scenarios[key], d = sc.data;
    ctx.clearRect(0,0,LW,LH);
    ctx.textAlign = 'left';

    var qx=14, qy=14, qw=216, qh=126;
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
    ctx.strokeRect(qx,qy,qw,qh);
    ctx.fillStyle = COL.sub; ctx.font = MONO;
    ctx.fillText('WAITING', qx, qy-4);

    var waiting = countWaiting(d,t);
    var cols=15, r=5, gap=14;
    for (var k=0;k<waiting;k++){
      var col = k % cols, row = Math.floor(k/cols);
      var cx = qx+10+col*gap, cy = qy+14+row*gap;
      if (cy > qy+qh-6) break;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.fillStyle = COL[sc.color]; ctx.fill();
    }

    var sx=250, sy=14, sw=70, sh=126;
    var inService = countInService(d,t);
    for (var s=0;s<sc.servers;s++){
      var iy = sy + s*(sh/sc.servers) + (sh/sc.servers)/2;
      var busy = s < inService;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(sx, iy-16, sw, 32, 6); else ctx.rect(sx, iy-16, sw, 32);
      ctx.fillStyle = busy ? COL[sc.color] : COL.card;
      ctx.strokeStyle = COL.line;
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = busy ? '#ffffff' : COL.sub;
      ctx.font = SANS; ctx.textAlign = 'center';
      ctx.fillText(sc.servers>1 ? 'Photog '+(s+1) : 'Photographer', sx+sw/2, iy+4);
      ctx.textAlign = 'left';
    }

    var tx=332, ty=30;
    var arrived = countArrived(d,t), served = countServed(d,t);
    ctx.fillStyle = COL.ink; ctx.font = "11px 'IBM Plex Mono',ui-monospace,monospace";
    ctx.fillText('Elapsed: '+t.toFixed(0)+' / '+WINDOW+' min'+(t>WINDOW?' (past lunch)':''), tx, ty);
    ctx.fillText('Arrived: '+arrived+' / '+N, tx, ty+20);
    ctx.fillText('Waiting: '+waiting, tx, ty+40);
    ctx.fillText('Served: '+served+' / '+N, tx, ty+60);

    var cx0=40, cy0=160, cw=406, ch=68;
    ctx.strokeStyle = COL.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx0,cy0); ctx.lineTo(cx0,cy0+ch); ctx.lineTo(cx0+cw,cy0+ch); ctx.stroke();

    var lx = cx0 + (WINDOW/ANIM_MAX)*cw;
    ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(lx,cy0); ctx.lineTo(lx,cy0+ch); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = COL.sub; ctx.font = MONO;
    ctx.fillText('lunch ends', lx+3, cy0+10);
    ctx.fillText('0', cx0-4, cy0+ch+12);
    ctx.fillText(ANIM_MAX+' min', cx0+cw-26, cy0+ch+12);
    ctx.fillText(maxW+'', cx0-16, cy0+6);

    var series = sc.series, nPts = Math.floor(t/CHART_DT);
    ctx.beginPath();
    for (var p=0;p<=nPts && p<series.length;p++){
      var xx = cx0 + (p*CHART_DT/ANIM_MAX)*cw;
      var yy = cy0+ch - (series[p]/maxW)*ch;
      if (p===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.strokeStyle = COL[sc.color]; ctx.lineWidth = 2; ctx.stroke();
  }

  var startTs = null;
  var RATE = ANIM_MAX/22; // sim-minutes per real second (~22s full run)
  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function frame(now){
    if (!startTs) startTs = now;
    var elapsed = (now-startTs)/1000 * RATE;
    if (elapsed > ANIM_MAX) elapsed = ANIM_MAX;
    Object.keys(canvases).forEach(function(key){ drawPanel(canvases[key], key, elapsed); });
    if (elapsed < ANIM_MAX){ requestAnimationFrame(frame); }
    else { var btn=document.getElementById('simPlay'); if (btn) btn.textContent = '↺ Replay'; }
  }

  function start(){
    startTs = null;
    var btn = document.getElementById('simPlay'); if (btn) btn.textContent = '↺ Restart';
    requestAnimationFrame(frame);
  }

  var playBtn = document.getElementById('simPlay');
  if (playBtn) playBtn.addEventListener('click', start);

  if (REDUCED_MOTION){
    Object.keys(canvases).forEach(function(key){ drawPanel(canvases[key], key, ANIM_MAX); });
    if (playBtn) playBtn.textContent = '▶ Play animation';
  } else {
    Object.keys(canvases).forEach(function(key){ drawPanel(canvases[key], key, 0); });
    setTimeout(start, 500);
  }
})();

    position: relative;
  }
  .ticket-item:last-child { border-right: none; }
  .ticket-val { font-family: "IBM Plex Mono"; font-weight: 600; font-size: 27px; color: var(--ink); }
  .ticket-val.counting { animation: count-blink 0.13s ease-in-out infinite alternate; color: var(--accent); }
  .ticket-label { margin-top: 4px; font-size: 12px; color: var(--ink-muted); line-height: 1.35; }
  @media (max-width: 640px) {
    .ticket { display: grid; grid-template-columns: 1fr 1fr; overflow-x: visible; }
    .ticket-item { border-right: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); padding: 16px; }
    .ticket-item:nth-child(2n) { border-right: none; }
    .ticket-item:nth-last-child(-n+2) { border-bottom: none; }
  }

  /* ===================== GENERIC BLOCKS ===================== */
  .h2-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 40px; }
  h2 { font-size: clamp(30px, 4vw, 42px); font-weight: 800; max-width: 22ch; }
  .lede { color: var(--ink-soft); font-size: 16.5px; max-width: 50ch; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    transition: transform 0.28s cubic-bezier(.16,.8,.3,1), box-shadow 0.28s ease, border-color 0.28s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: var(--line-strong);
  }

  /* ===================== PROBLEM / LOOP DIAGRAM ===================== */
  .loop-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 36px 28px; box-shadow: var(--shadow); }
  .loop-row { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .loop-node {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 128px; text-align: center;
  }
  .loop-node .dot {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--surface-2); border: 1.5px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 600; font-size: 15px; color: var(--ink);
  }
  .loop-node.exit .dot { border-color: var(--good); color: var(--good); }
  .loop-node .cap { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .loop-arrow {
    flex: 1 1 34px; min-width: 24px; height: 2px; position: relative; margin-top: -20px;
    background-image: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px);
    background-size: 24px 2px;
    animation: dash-march 1.1s linear infinite;
  }
  .loop-arrow::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-style: solid; border-width: 4px 0 4px 6px;
    border-color: transparent transparent transparent var(--line-strong);
  }
  .loop-back {
    margin: 10px auto 0; max-width: 640px;
    border: 1.5px dashed var(--flag); border-radius: 999px;
    padding: 9px 18px;
    font-family: "IBM Plex Mono"; font-size: 13px; color: var(--flag-text);
    display: flex; align-items: center; gap: 8px; justify-content: center;
    background: var(--flag-soft);
    animation: pulse-ring 2.6s ease-in-out infinite;
  }
  .loop-back .spin { display: inline-block; animation: spin-loop 2.4s linear infinite; }
  @keyframes spin-loop { to { transform: rotate(-360deg); } }
  .loop-split { display: flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .split-card { flex: 1 1 220px; border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); }
  .split-card.good { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .split-card.warn { background: var(--flag-soft); border-color: color-mix(in srgb, var(--flag) 45%, var(--line)); }
  .split-card .pct { font-family: "IBM Plex Mono"; font-weight: 700; font-size: 24px; }
  .split-card.good .pct { color: var(--good); }
  .split-card.warn .pct { color: var(--flag-text); }
  .split-card p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-soft); }

  /* ===================== JOURNEY / ROUTE MAP ===================== */
  .route-row { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .route-node {
    flex: 0 0 auto; width: 148px; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  .route-node .ricon {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--surface-2); border: 1.5px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .route-node.highlight .ricon { border-color: var(--flag); background: var(--flag-soft); animation: pulse-ring 2.4s ease-in-out infinite; }
  .route-node .rcap { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .route-node .rcap span { display: block; font-weight: 400; color: var(--ink-soft); font-size: 11px; margin-top: 3px; }
  .route-arrow {
    flex: 1 1 20px; min-width: 14px; height: 2px; position: relative; margin-top: -24px;
    background-image: repeating-linear-gradient(90deg, var(--line-strong) 0 6px, transparent 6px 12px);
    background-size: 24px 2px;
    animation: dash-march 1.1s linear infinite;
  }
  @media (max-width: 760px) {
    .route-row { justify-content: center; }
    .route-arrow { flex-basis: 100%; height: 18px; margin-top: 0; width: 2px; }
  }

  .note-box {
    background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 14px 18px; font-size: 13.5px; color: var(--ink-soft);
  }
  .note-box.accent { border-left: 3px solid var(--flag); font-size: 15px; color: var(--ink); }
  .note-box strong { color: var(--ink); }

  .reason-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 900px) { .reason-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .reason-grid { grid-template-columns: 1fr; } }
  .reason-card { cursor: pointer; }
  .reason-head { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
  .reason-head .ric { font-size: 19px; }
  .reason-head .chev { margin-left: auto; color: var(--ink-muted); transition: transform 0.25s ease; font-size: 13px; }
  .reason-card.open .chev { transform: rotate(180deg); color: var(--accent); }
  .reason-body {
    max-height: 0; overflow: hidden; opacity: 0;
    font-size: 13px; color: var(--ink-soft); line-height: 1.5;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin-top 0.3s ease;
  }
  .reason-card.open .reason-body { max-height: 140px; opacity: 1; margin-top: 10px; }

  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  @media (max-width: 760px) { .lanes { grid-template-columns: 1fr; } }
  .lane { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; background: var(--surface-2); display: flex; flex-direction: column; }
  .lane-head { margin-bottom: 13px; }
  .lane-title { font-family: "IBM Plex Mono"; font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); }
  .lane.good { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .lane.good .lane-title { color: var(--good); }
  .lane.bad { border-color: color-mix(in srgb, var(--critical) 40%, var(--line)); }
  .lane.bad .lane-title { color: var(--critical); }

  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step { display: flex; align-items: flex-start; gap: 11px; font-size: 13.5px; }
  .step .mk {
    flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-size: 11px; font-weight: 700; line-height: 1;
  }
  .step.ok .mk { background: var(--good-soft); color: var(--good); }
  .step.bad .mk { background: var(--critical-soft); color: var(--critical); }
  .step.wait .mk { background: var(--warn-soft); color: var(--warn); }
  .step.info .mk { background: var(--accent-soft); color: var(--accent); }
  .step .tx { line-height: 1.4; }
  .step .tx strong { display: block; color: var(--ink); font-weight: 600; }
  .step .tx span { color: var(--ink-soft); font-size: 12.5px; }

  blockquote.thesis {
    margin: 40px 0 0; padding: 0 0 0 22px; border-left: 3px solid var(--flag);
    font-family: "Big Shoulders Display"; font-weight: 700;
    font-size: clamp(22px, 3vw, 30px); line-height: 1.18; max-width: 26ch;
  }

  /* ===================== BOTTLENECK / BPM ===================== */
  .subhead { display: flex; align-items: center; gap: 11px; margin-top: 52px; margin-bottom: 4px; }
  .subhead .sn {
    width: 25px; height: 25px; border-radius: 50%; flex: 0 0 auto;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 700; font-size: 12px;
  }
  .subhead h3 { font-size: 21px; margin: 0; }
  .subhead + .lede { margin-top: 6px; margin-bottom: 20px; }

  .why-now-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .why-now-grid { grid-template-columns: 1fr; } }
  .type-card { display: flex; flex-direction: column; gap: 9px; }
  .type-card .tk {
    font-family: "IBM Plex Mono"; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; display: inline-flex; width: max-content;
  }
  .type-card.loop .tk { background: var(--accent-soft); color: var(--accent); }
  .type-card.shock .tk { background: var(--flag-soft); color: var(--flag-text); }
  .type-card h3 { font-family: "Big Shoulders Display"; font-size: 20px; font-weight: 800; margin: 0; line-height: 1.2; }
  .type-card p { font-size: 13.5px; color: var(--ink-soft); margin: 0; }
  .type-card .tstat { display: flex; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
  .type-card .tstat b { display: block; font-family: "IBM Plex Mono"; font-size: 19px; color: var(--ink); }
  .type-card .tstat span { display: block; font-size: 11px; color: var(--ink-muted); }
  .type-card .tsrc { font-size: 11.5px; color: var(--ink-muted); margin-top: 4px; }
  .type-card .tsrc a { color: var(--ink-muted); }

  .glossary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 900px) { .glossary-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .glossary-grid { grid-template-columns: 1fr; } }
  .gloss-card { padding: 14px 16px; }
  .gloss-term {
    font-family: "IBM Plex Mono"; font-weight: 600; font-size: 12.5px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .gloss-def { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }
  .gloss-def b { color: var(--ink); }

  .law-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 34px 30px; box-shadow: var(--shadow); text-align: center; }
  .law-eq { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 24px 0; }
  .law-term { min-width: 96px; }
  .law-term .lv { font-family: "IBM Plex Mono"; font-size: 30px; font-weight: 700; color: var(--ink); }
  .law-term.hi .lv { color: var(--accent); }
  .law-term .ll { font-size: 11.5px; color: var(--ink-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .law-op { font-family: "IBM Plex Mono"; font-size: 24px; color: var(--ink-muted); }
  .law-note { font-size: 13.5px; color: var(--ink-soft); max-width: 58ch; margin: 0 auto; }
  .law-note b { color: var(--ink); }
  .term { border-bottom: 1px dotted var(--ink-muted); }

  /* ===================== LANDSCAPE ===================== */
  .carrier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 800px) { .carrier-grid { grid-template-columns: 1fr; } }
  .carrier-card { display: flex; flex-direction: column; gap: 12px; }
  .carrier-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .carrier-name { font-family: "Big Shoulders Display"; font-weight: 800; font-size: 20px; line-height: 1.15; }
  .pill {
    font-family: "IBM Plex Mono"; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 4px 9px; border-radius: 999px; text-transform: uppercase;
    background: var(--warn-soft); color: var(--warn);
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: 0 0 auto; margin-top: 2px;
  }
  .pill.auto { background: var(--good-soft); color: var(--good); }
  .carrier-tool { font-size: 14px; font-weight: 600; line-height: 1.4; min-height: 2.8em; }
  .carrier-desc { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
  .carrier-src { font-size: 11.5px; color: var(--ink-muted); }
  .carrier-src a { color: var(--ink-muted); }

  .verdict-banner {
    margin-top: 22px; padding: 20px 24px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--line-strong);
    display: flex; gap: 16px; align-items: flex-start;
  }
  .verdict-banner .mark {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    background: var(--flag-soft); color: var(--flag-text); border: 1.5px solid var(--flag);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: "IBM Plex Mono";
  }
  .verdict-banner p { margin: 0; font-size: 15px; }
  .verdict-banner strong { color: var(--ink); }

  /* ===================== SIMULATION ===================== */
  .solution-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 36px; }
  @media (max-width: 860px) { .solution-cards { grid-template-columns: 1fr; } }
  .sol-card { display: flex; flex-direction: column; gap: 10px; }
  .sol-head { display: flex; align-items: flex-start; gap: 11px; min-height: 62px; }
  .sol-badge {
    width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Mono"; font-weight: 700; font-size: 15px;
  }
  .sol-card .sol-badge { background: var(--accent-soft); color: var(--accent); }
  .sol-name { font-family: "Big Shoulders Display"; font-weight: 800; font-size: 20px; line-height: 1.2; }
  .sol-tag { font-size: 10.5px; color: var(--ink-muted); font-family: "IBM Plex Mono"; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.5; display: block; min-height: 2.2em; margin-top: 3px; }
  .sol-desc { font-size: 13.5px; color: var(--ink-soft); flex: 1; }
  .sol-lever { font-size: 12px; color: var(--ink-muted); border-top: 1px dashed var(--line-strong); padding-top: 11px; margin-top: 2px; }
  .sol-lever b { color: var(--ink); }

  .sim-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 26px 30px; }
  .sim-toprow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; }
  .sim-switches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swpill {
    display: flex; align-items: center; gap: 9px; padding: 8px 14px 8px 10px;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface-2);
    font-size: 13px; cursor: pointer; user-select: none;
    transition: border-color 0.18s ease, transform 0.15s ease;
  }
  .swpill:hover { transform: translateY(-1px); border-color: var(--accent); }
  .swpill input { position: absolute; opacity: 0; width: 0; height: 0; }
  .swpill .knob { width: 30px; height: 17px; border-radius: 999px; background: var(--line-strong); position: relative; flex: 0 0 auto; transition: background 0.2s ease; }
  .swpill .knob::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface-2); transition: transform 0.2s cubic-bezier(.2,1.2,.4,1);
  }
  .swpill input:checked + .knob { background: var(--accent); }
  .swpill input:checked + .knob::after { transform: translateX(13px); background: #fff; }
  .swpill.surge input:checked + .knob { background: var(--critical); }
  .swpill .swlbl { color: var(--ink-soft); }
  .swpill input:checked ~ .swlbl { color: var(--ink); font-weight: 600; }
  .swpill:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sim-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .simbtn {
    font-family: "IBM Plex Mono"; font-weight: 600; font-size: 12.5px; letter-spacing: 0.02em;
    padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line-strong); cursor: pointer;
    background: var(--surface-2); color: var(--ink);
    transition: transform 0.15s ease, border-color 0.15s ease, filter 0.15s ease;
  }
  .simbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .simbtn:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .simbtn:disabled { opacity: 0.5; cursor: default; transform: none; }
  .sim-day { font-family: "IBM Plex Mono"; font-size: 12.5px; color: var(--ink-muted); }

  .sim-body { display: grid; grid-template-columns: 1.15fr 1fr; gap: 26px; }
  @media (max-width: 900px) { .sim-body { grid-template-columns: 1fr; } }

  .sim-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .sim-stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 12px 12px; text-align: center; }
  .sim-stat .sv { font-family: "IBM Plex Mono"; font-weight: 700; font-size: 23px; color: var(--ink); transition: color 0.3s ease; }
  .sim-stat .sl { font-size: 10.5px; color: var(--ink-muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sim-stat.danger .sv { color: var(--critical); }
  .sim-stat.good .sv { color: var(--good); }

  .util-row { margin-top: 16px; }
  .util-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-muted); margin-bottom: 5px; font-family: "IBM Plex Mono"; }
  .util-track { height: 10px; border-radius: 5px; background: var(--chart-grid); overflow: hidden; }
  .util-fill { height: 100%; border-radius: 5px; background: var(--good); transition: width 0.3s ease, background 0.3s ease; width: 0%; }

  .spark-wrap { margin-top: 18px; }
  .spark-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 6px; font-family: "IBM Plex Mono"; text-transform: uppercase; letter-spacing: 0.04em; }
  .spark { display: flex; align-items: flex-end; gap: 2px; height: 62px; border-bottom: 1px solid var(--line-strong); }
  .spark-bar { flex: 1 1 auto; min-width: 2px; background: var(--chart-cur); border-radius: 2px 2px 0 0; transition: height 0.15s linear, background 0.2s ease; }
  .spark-bar.over { background: var(--critical); }

  .qv-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 8px; font-family: "IBM Plex Mono"; text-transform: uppercase; letter-spacing: 0.04em; }
  .qv-track {
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 5px; min-height: 132px;
    padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  }
  .qv-dot { width: 11px; height: 11px; border-radius: 3px; background: var(--chart-cur); opacity: 0.9; }
  .qv-dot.wait { background: var(--flag); }
  .qv-more { font-family: "IBM Plex Mono"; font-size: 12px; color: var(--ink-muted); align-self: center; }
  .qv-empty { font-size: 12.5px; color: var(--ink-muted); align-self: center; margin: auto; }

  .sim-note { font-size: 12px; color: var(--ink-muted); margin-top: 18px; max-width: 74ch; }
  .sim-alert {
    margin-top: 14px; padding: 12px 14px; border-radius: 9px;
    background: var(--critical-soft); border: 1px solid color-mix(in srgb, var(--critical) 40%, var(--line));
    color: var(--critical); font-size: 13px; display: none;
  }
  .sim-alert.show { display: block; }

  /* ===================== RESULTS ===================== */
  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card { padding: 20px 22px 18px; display: flex; flex-direction: column; }
  .kpi-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .kpi-sub { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; min-height: 2.6em; }
  .kpi-full { margin-top: 20px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { flex: 0 0 68px; font-size: 12px; color: var(--ink-soft); font-family: "IBM Plex Mono"; }
  .bar-track { flex: 1; height: 20px; background: var(--chart-grid); border-radius: 5px; position: relative; overflow: visible; min-width: 0; }
  .bar-fill { height: 100%; border-radius: 5px; min-width: 3px; width: 0; transition: width 1.1s cubic-bezier(.16,.8,.3,1); }
  .bar-fill.cur { background: var(--chart-cur); }

<header class="hero">
  <div class="wrap">
    <div class="reveal" id="hero-copy">
      <div class="eyebrow">Business Process Management Case Study: International Customs Clearance</div>
      <h1>120 held packages a month. One <em>loop</em> causes most of the delay, and a demand shock just made it worse.</h1>
      <p class="sub">A held package doesn't stall because nobody's working it: it stalls because the same request for missing information bounces back and forth. A 2025 rule change also pushed far more packages into this exact queue. Here's the math behind the backlog, and three fixes tested with a live simulation.</p>
    </div>

    <div class="ticket reveal-stagger" id="ticket">
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="120" data-decimals="0" data-suffix="">0</div><div class="ticket-label"><span class="term" title="Undeliverable: a package customs has flagged and held, opening a case.">UTL</span> cases / month</div></div>
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="55" data-decimals="0" data-suffix="%">0</div><div class="ticket-label">resolved on the first pass</div></div>
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="1.93" data-decimals="2" data-suffix="">0</div><div class="ticket-label">avg. round trips / case</div></div>
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="3.7" data-decimals="1" data-suffix="d">0</div><div class="ticket-label">avg. cycle time</div></div>
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="80" data-decimals="0" data-suffix="%">0</div><div class="ticket-label">resolved within <span class="term" title="Service Level Agreement: this case study targets 7 days from flag to resolution.">SLA</span></div></div>
      <div class="ticket-item"><div class="ticket-val tnum" data-count data-target="15" data-decimals="0" data-suffix="">0</div><div class="ticket-label">cases open at once, via <span class="term" title="Little's Law: L = λ × W. Cases open at once equals the arrival rate times the average time each case stays open.">Little's Law</span></div></div>
    </div>
  </div>
</header>

<section id="journey">
  <div class="wrap">
    <div class="eyebrow reveal">The big picture</div>
    <h2 class="reveal">How a package gets from a warehouse in one country to a doorstep in another</h2>
    <p class="lede reveal" style="margin-top:10px;">Zoom out first. Here's the whole trip a shipment takes, and the one place it can get stuck.</p>

    <div class="loop-wrap reveal" style="margin-top:34px;">
      <div class="route-row">
        <div class="route-node"><div class="ricon">📦</div><div class="rcap">Pickup<span>Shipper hands off the package</span></div></div>
        <div class="route-arrow"></div>
        <div class="route-node"><div class="ricon">🏭</div><div class="rcap">Origin Hub<span>Sorted, labeled, loaded</span></div></div>
        <div class="route-arrow"></div>
        <div class="route-node"><div class="ricon">✈️</div><div class="rcap">Int'l Transit<span>Flies or ships across the border</span></div></div>
        <div class="route-arrow"></div>
        <div class="route-node highlight"><div class="ricon">🛃</div><div class="rcap">Destination Customs<span>Checked against paperwork &amp; rules</span></div></div>
        <div class="route-arrow"></div>
        <div class="route-node"><div class="ricon">🚚</div><div class="rcap">Last Mile<span>Out for delivery, doorstep</span></div></div>
      </div>

      <div class="loop-split" style="margin-top:26px;">
        <div class="split-card good">
          <div class="pct" style="font-size:15px;">✅ Cleared</div>
          <p>Most packages sail through customs and go straight on to delivery: no detour, no case.</p>
        </div>
        <div class="split-card warn">
          <div class="pct" style="font-size:15px;">🛑 Held</div>
          <p>Something's wrong with the shipment. It gets tagged <strong>UTL</strong> (undeliverable) and a case opens. This site zooms in on that branch.</p>
        </div>
      </div>

      <div class="note-box" style="margin-top:20px;">Every package moving through this trip is one <strong>flow unit</strong> (the unit tracked from step to step). A thousand packages means a thousand flow units, each moving through the same stages.</div>
    </div>

    <div class="subhead reveal"><span class="sn">1</span><h3>Why does a package get held at customs?</h3></div>
    <p class="lede reveal">Six common reasons. Tap one to see why it matters.</p>

    <div class="reason-grid reveal-stagger" style="margin-top:24px;">
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">📄</span>Missing or wrong invoice<span class="chev">⌄</span></div>
        <div class="reason-body">Customs can't verify what's inside, or what it's worth, without a correct commercial invoice.</div>
      </div>
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">🚫</span>Prohibited at destination<span class="chev">⌄</span></div>
        <div class="reason-body">The item is banned or restricted for that specific country: no permit fixes it; the shipment must be returned or destroyed.</div>
      </div>
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">💰</span>Unpaid duty or tax<span class="chev">⌄</span></div>
        <div class="reason-body">Import charges weren't paid up front, or the payment on file failed.</div>
      </div>
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">📜</span>Missing import permit<span class="chev">⌄</span></div>
        <div class="reason-body">The item is allowed in, but regulated goods (food, cosmetics, electronics) need a specific agency permit on file: a separate approval from the invoice.</div>
      </div>
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">⚠️</span>Denied party match<span class="chev">⌄</span></div>
        <div class="reason-body">A name on the shipment matches a sanctions or watchlist entry and needs manual review.</div>
      </div>
      <div class="card reason-card" onclick="toggleReason(this)">
        <div class="reason-head"><span class="ric">🔍</span>Valuation or code dispute<span class="chev">⌄</span></div>
        <div class="reason-body">Customs disagrees with the declared value or the product's classification code, and either changes the duty owed.</div>
      </div>
    </div>

    <div class="subhead reveal"><span class="sn">2</span><h3>What happens next</h3></div>
    <div class="lanes reveal-stagger" style="margin-top:18px;">
      <div class="lane good">
        <div class="lane-head"><span class="lane-title">If it gets resolved</span></div>
        <div class="steps">
          <div class="step info"><span class="mk">1</span><span class="tx"><strong>Agent reaches out</strong><span>Asks shipper/recipient for what's missing</span></span></div>
          <div class="step ok"><span class="mk">✓</span><span class="tx"><strong>Info or payment provided</strong><span>The gap gets closed</span></span></div>
          <div class="step ok"><span class="mk">✓</span><span class="tx"><strong>Cleared &amp; delivered</strong><span>Often within days once complete</span></span></div>
        </div>
      </div>
      <div class="lane bad">
        <div class="lane-head"><span class="lane-title">If it doesn't</span></div>
        <div class="steps">
          <div class="step wait"><span class="mk">!</span><span class="tx"><strong>Contact attempts fail</strong><span>Unanswered, or still incomplete</span></span></div>
          <div class="step bad"><span class="mk">✗</span><span class="tx"><strong>Carrier policy kicks in</strong><span>FedEx/UPS may return or dispose; DHL only returns, after ~10 days</span></span></div>
          <div class="step bad"><span class="mk">✗</span><span class="tx"><strong>Someone pays for it</strong><span>Storage, return freight, a refund, and a customer who never got their order</span></span></div>
        </div>
      </div>
    </div>
    <p class="carrier-src" style="margin-top:10px;">Source: <a href="https://www.supplychaindive.com/news/package-disposal-policies-ups-fedex-dhl/803468/" target="_blank" rel="noopener">FedEx, UPS &amp; DHL reporting after the de minimis change, Aug 2026</a></p>

    <div class="note-box accent reveal" style="margin-top:32px;">
      <strong>So where's the bottleneck?</strong> Not the customs check: that's fast. It's everything <em>after</em> a hold: ask, wait, get an incomplete answer, ask again. And a second pressure compounds it: new import rules are pushing more packages into this exact queue. Both are diagnosed next. ↓
    </div>
  </div>
</section>

<section id="bottleneck">
  <div class="wrap">
    <div class="eyebrow">Diagnosing the bottleneck, with the numbers</div>
    <h2>Two different pressures, squeezing this process at once.</h2>
    <p class="lede" style="margin-top:10px;">One is <em>structural</em>, baked into how a case is handled. The other is a <em>demand</em> shock, how many cases show up at all. Different problems, different fixes.</p>

    <div class="why-now-grid reveal-stagger" style="margin-top:26px;">
      <div class="card type-card loop">
        <span class="tk">Bottleneck 1 · Process</span>
        <h3>The communication loop</h3>
        <p>An agent asks for missing info, gets back only part of it, and the case resets to "waiting": the same request goes out again.</p>
        <div class="tstat">
          <div><b>45%</b><span>of cases loop at least once</span></div>
          <div><b>1.93</b><span>avg. round trips to close</span></div>
        </div>
      </div>
      <div class="card type-card shock">
        <span class="tk">Bottleneck 2 · Demand</span>
        <h3>The de minimis shock</h3>
        <p>On <strong>Aug 29, 2025</strong>, the U.S. ended duty free entry for shipments under $800. Far more low value packages now need a full customs entry, exactly the population that can get flagged UTL.</p>
        <div class="tstat">
          <div><b>$800 → $0</b><span>duty free threshold eliminated</span></div>
          <div><b>All origins</b><span>no country is exempted</span></div>
        </div>
        <div class="tsrc">Source: <a href="https://www.whitecase.com/insight-alert/united-states-suspend-customs-de-minimis-entry-most-shipments-august-29-2025" target="_blank" rel="noopener">White &amp; Case</a>, <a href="https://www.cnbc.com/2025/08/29/retail-impact-de-minimis-exemption-ends-globally.html" target="_blank" rel="noopener">CNBC</a></div>
      </div>
    </div>

    <div class="subhead reveal"><span class="sn">1</span><h3>Little's Law, applied to this process</h3></div>
    <p class="lede reveal"><span class="term" title="A queueing theory result: at steady state, the average number of items in a system equals the rate they arrive times the average time each one stays.">Little's Law</span> states <b>L = λ × W</b>: cases open at once equals the arrival rate times the average time each case stays open. Four terms, defined against this case, feed that equation.</p>

    <div class="glossary-grid reveal-stagger" style="margin-top:18px;">
      <div class="card gloss-card">
        <div class="gloss-term">Flow unit</div>
        <div class="gloss-def">One UTL case, flagged to closed.</div>
      </div>
      <div class="card gloss-card">
        <div class="gloss-term">Cycle time (W)</div>
        <div class="gloss-def">Time in the process: <b>3.7 days</b> avg.</div>
      </div>
      <div class="card gloss-card">
        <div class="gloss-term">Capacity</div>
        <div class="gloss-def">Cases the team can actively work at once.</div>
      </div>
      <div class="card gloss-card">
        <div class="gloss-term">Bottleneck</div>
        <div class="gloss-def">The step that paces everything downstream, not the one that looks busiest.</div>
      </div>
    </div>

    <div class="law-card reveal" style="margin-top:26px;">
      <div class="law-eq">
        <div class="law-term hi"><div class="lv">120/mo</div><div class="ll">λ · arrivals<br>≈ 4 / day</div></div>
        <div class="law-op">×</div>
        <div class="law-term hi"><div class="lv">3.7d</div><div class="ll">W · cycle time</div></div>
        <div class="law-op">=</div>
        <div class="law-term"><div class="lv">≈ 15</div><div class="ll">L · cases open<br>at any moment</div></div>
      </div>
      <p class="law-note">~15 UTL cases are in flight on a typical day. Cut λ or cut W and L falls with it. Raise λ (the de minimis shock) without raising capacity, and L rises twice over: directly, because more cases open, and indirectly, because a backlog that outpaces capacity makes W grow too.</p>
    </div>

    <div class="subhead reveal"><span class="sn">2</span><h3>Bottleneck 1, up close: one case, three conversations</h3></div>

    <div class="loop-wrap reveal" style="margin-top:20px;">
      <div class="loop-row">
        <div class="loop-node"><div class="dot">①</div><div class="cap">Case flagged, opens as UTL</div></div>
        <div class="loop-arrow"></div>
        <div class="loop-node"><div class="dot">②</div><div class="cap">Agent requests missing info</div></div>
        <div class="loop-arrow"></div>
        <div class="loop-node"><div class="dot">③</div><div class="cap">Shipper/recipient replies</div></div>
        <div class="loop-arrow"></div>
        <div class="loop-node exit"><div class="dot">✓</div><div class="cap">Case resolved</div></div>
      </div>
      <div class="loop-back"><span class="spin">↺</span> incomplete reply → back to step ② → average 1.93 round trips before resolution</div>

      <div class="loop-split">
        <div class="split-card good">
          <div class="pct tnum">55%</div>
          <p>give a complete reply on the first request; one pass, done.</p>
        </div>
        <div class="split-card warn">
          <div class="pct tnum">45%</div>
          <p>come back partial and loop through the request again, sometimes more than once.</p>
        </div>
      </div>
    </div>

    <blockquote class="thesis reveal">"The visible activity is not the actual constraint."</blockquote>
  </div>
</section>

<section id="landscape">
  <div class="wrap">
    <div class="eyebrow">Reality check, before designing anything</div>
    <div class="h2-row">
      <h2>Is this already solved at FedEx? What about UPS and DHL?</h2>
      <p class="lede">Researched Aug through Sept 2026, from each carrier's own public documentation and live product pages.</p>
    </div>

    <div class="carrier-grid reveal-stagger">
      <div class="card carrier-card">
        <div class="carrier-head"><span class="carrier-name">FedEx</span><span class="pill">Optional, fragmented</span></div>
        <div class="carrier-tool">Global Trade Manager + International Shipping Assist</div>
        <p class="carrier-desc">Two separate portals, each requiring manual enrollment: one for denied party screening, one for <span class="term" title="Harmonized System code: the standardized number that classifies a product and sets the duty rate.">HS codes</span> and duty. Neither runs automatically at label creation.</p>
        <div class="carrier-src">Source: <a href="https://www.fedex.com/en-us/shipping/international/how-to-ship.html" target="_blank" rel="noopener">fedex.com</a>, <a href="https://internationalshippingassist.van.fedex.com/en-us" target="_blank" rel="noopener">shipping assist</a></div>
      </div>
      <div class="card carrier-card">
        <div class="carrier-head"><span class="carrier-name">UPS</span><span class="pill">Optional tool</span></div>
        <div class="carrier-tool">TradeAbility</div>
        <p class="carrier-desc">Denied party, export license, and HS lookup in one portal, the closest match to a shift left gate. Still standalone, not mandatory.</p>
        <div class="carrier-src">Source: <a href="https://www.ups.com/us/en/support/international-tools-resources/ups-tradeability" target="_blank" rel="noopener">ups.com</a></div>
      </div>
      <div class="card carrier-card">
        <div class="carrier-head"><span class="carrier-name">DHL</span><span class="pill">Automatic, but narrow</span></div>
        <div class="carrier-tool">Denied Party Screening + AI Item Identification</div>
        <p class="carrier-desc">Denied Party Screening is the one mandatory, automatic check found anywhere, but it only checks names against sanctions lists, not invoices or duty. A new tool (May 2026) lets a customer photograph the item and get an AI generated customs description at booking, but it's optional, and the customer reviews and can edit it before submitting.</p>
        <div class="carrier-src">Source: <a href="https://www.dhl.com/content/dam/dhl/local/gb/dhl-parcel/documents/pdf/gb-parcel-denied-party-screening.pdf" target="_blank" rel="noopener">dhl.com</a>, <a href="https://group.dhl.com/en/media-relations/press-releases/2026/dhl-express-introduces-ai-powered-item-identification-for-international-shipping.html" target="_blank" rel="noopener">DHL Group, May 2026</a></div>
      </div>
    </div>

    <div class="verdict-banner reveal">
      <div class="mark">✓</div>
      <p><strong>None of the three levers below are redundant with anything in production today.</strong> Every carrier's compliance tool is optional or narrow; none gates a shipment automatically <em>before it ships</em>. DHL's new photo based item description tool (May 2026) points the same direction as Solution A, but it stays optional and only suggests text, it doesn't block a shipment the way a mandatory gate would. And <a href="https://www.supplychaindive.com/news/package-disposal-policies-ups-fedex-dhl/803468/" target="_blank" rel="noopener">reporting after the de minimis change</a> shows all three still resolving cases with manual phone calls.</p>
    </div>
  </div>
</section>

<section id="simulation">
  <div class="wrap">
    <div class="eyebrow">Three levers, modeled</div>
    <div class="h2-row">
      <h2>Each fix targets a different variable in the queueing math above.</h2>
      <p class="lede">Prevent shrinks arrivals. Recover shrinks cycle time. Scale grows capacity. Toggle them below and watch backlog, cycle time, and SLA respond live.</p>
    </div>

    <div class="solution-cards reveal-stagger">
      <div class="card sol-card a">
        <div class="sol-head"><div class="sol-badge">A</div><div><div class="sol-name">Prevent</div><div class="sol-tag">Shift left compliance gate</div></div></div>
        <p class="sol-desc">One automatic, mandatory check at label creation. The shipper photographs the item and AI drafts the invoice description, then the same gate verifies commodity, duty, and denied party matches, merging FedEx's existing fragmented tools. Nothing ships until it passes.</p>
        <div class="sol-lever">Lever: cuts <b>λ</b>, the arrival rate; fewer cases ever open</div>
      </div>
      <div class="card sol-card b">
        <div class="sol-head"><div class="sol-badge">B</div><div><div class="sol-name">Recover</div><div class="sol-tag">Parallel multi channel outreach</div></div></div>
        <p class="sol-desc">Email + SMS + a self serve upload link, to shipper and recipient at once, replacing today's single sequential phone call.</p>
        <div class="sol-lever">Lever: cuts <b>W</b>, the cycle time; cases that do open resolve faster</div>
      </div>
      <div class="card sol-card c">

<\script>
  function toggleReason(el) {
    const wasOpen = el.classList.contains('open');
    el.parentElement.querySelectorAll('.reason-card.open').forEach(c => { if (c !== el) { c.classList.remove('open'); c.setAttribute('aria-expanded', 'false'); } });
    el.classList.toggle('open', !wasOpen);
    el.setAttribute('aria-expanded', String(!wasOpen));
  }

  // Make the reason cards keyboard operable: focusable, announced as toggle buttons, openable with Enter/Space.
  document.querySelectorAll('.reason-card').forEach(card => {
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-expanded', 'false');
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleReason(card); }
    });
  });

  // Mobile nav menu
  function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    const btn = document.getElementById('navToggle');
    const isOpen = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', String(isOpen));
    btn.textContent = isOpen ? '✕' : '☰';
  }
  function closeMobileMenu() {
    document.getElementById('mobileMenu').classList.remove('open');
    const btn = document.getElementById('navToggle');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = '☰';
  }

  // ---------- Motion: scroll reveals, count-up, animated bars ----------
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function animateCount(el) {
    if (el.dataset.counted) return;
    el.dataset.counted = '1';
    const target = parseFloat(el.dataset.target);
    const decimals = parseInt(el.dataset.decimals || '0', 10);
    const suffix = el.dataset.suffix || '';
    if (reducedMotion) { el.textContent = target.toFixed(decimals) + suffix; return; }
    el.classList.add('counting');
    const duration = 900;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals) + suffix;
      if (p < 1) {
        requestAnimationFrame(tick);
      } else {
        el.classList.remove('counting');
      }
    }
    requestAnimationFrame(tick);
  }

  function animateBars(container) {
    const fills = container.querySelectorAll('.bar-fill[data-width]');
    fills.forEach((fill, i) => {
      setTimeout(() => { fill.style.width = fill.dataset.width; }, i * 90);
    });
  }

  if ('IntersectionObserver' in window) {
    const revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('in-view');
        if (entry.target.id === 'ticket') {
          entry.target.querySelectorAll('[data-count]').forEach(animateCount);
        }
        if (entry.target.classList.contains('kpi-grid')) {
          animateBars(entry.target);
        }
        obs.unobserve(entry.target);
      });
    }, { threshold: 0.2, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.reveal, .reveal-stagger, .stampmark').forEach(el => revealObserver.observe(el));
  } else {
    document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => el.classList.add('in-view'));
    document.querySelectorAll('.stampmark').forEach(el => el.classList.add('in-view'));
    document.querySelectorAll('[data-count]').forEach(animateCount);
    document.querySelectorAll('.bar-fill[data-width]').forEach(f => f.style.width = f.dataset.width);
  }

  setTimeout(() => {
    document.querySelectorAll('.reveal:not(.in-view), .reveal-stagger:not(.in-view), .stampmark:not(.in-view)')
      .forEach(el => el.classList.add('in-view'));
  }, 4000);

  // ================= LIVE QUEUEING SIMULATION =================
  // Discrete-time (1 tick = 1 simulated day) model, calibrated so that at
  // baseline parameters it reproduces roughly the dataset's shape:
  // ~4 cases/day, 55%/45% first-pass split, ~3.7d blended cycle time,
  // and (via Little's Law) a steady-state backlog near 15 cases.
  const SIM = {
    running: false,
    day: 0,
    queue: [],          // { remaining, elapsed }
    closedRing: [],      // rolling window of recently-closed { elapsed }
    backlogHistory: [],
    rngState: 42,
    timer: null,
  };
  const SLA_DAYS = 7;
  const RING_MAX = 60;
  const SPARK_MAX = 46;

  function simRand() {
    SIM.rngState = (SIM.rngState * 1664525 + 1013904223) >>> 0;
    return SIM.rngState / 4294967296;
  }

  function simParams() {
    const surge = document.getElementById('sw-surge').checked;
    const solA = document.getElementById('sw-a').checked;
    const solB = document.getElementById('sw-b').checked;
    const solC = document.getElementById('sw-c').checked;
    let lambda = 4;
    if (surge) lambda *= 2.5;
    if (solA) lambda *= 0.4;
    let p1 = 0.55;
    if (solB) p1 = 0.85;
    let capacity = 20;
    if (solC) capacity = 50;
    const avgDwell = p1 * 1.8 + (1 - p1) * 6.5; // matches the midpoints of the per-case random draws below
    return { lambda, p1, capacity, avgDwell, surge, solA, solB, solC };
  }

  function simTick() {
    const { lambda, p1, capacity } = simParams();
    const whole = Math.floor(lambda);
    const frac = lambda - whole;
    let arrivals = whole + (simRand() < frac ? 1 : 0);
    for (let i = 0; i < arrivals; i++) {
      const isFirst = simRand() < p1;
      const dwell = isFirst ? (0.8 + simRand() * 2.0) : (4.5 + simRand() * 4.0);
      SIM.queue.push({ remaining: dwell, elapsed: 0 });
    }
    let cap = capacity;
    const stillOpen = [];
    for (const c of SIM.queue) {
      c.elapsed += 1;
      if (cap > 0) { c.remaining -= 1; cap -= 1; }
      if (c.remaining <= 0) {
        SIM.closedRing.push({ elapsed: c.elapsed });
        if (SIM.closedRing.length > RING_MAX) SIM.closedRing.shift();
      } else {
        stillOpen.push(c);
      }
    }
    SIM.queue = stillOpen;
    SIM.day += 1;
    SIM.backlogHistory.push(SIM.queue.length);
    if (SIM.backlogHistory.length > SPARK_MAX) SIM.backlogHistory.shift();

    if (SIM.queue.length > 400) {
      simPause();
      document.getElementById('sim-alert').classList.add('show');
    }
    simRender();
  }

  function simRender() {
    const { lambda, capacity, avgDwell } = simParams();
    document.getElementById('sim-day-val').textContent = SIM.day;

    const backlogEl = document.getElementById('sv-backlog');
    backlogEl.textContent = SIM.queue.length;
    document.getElementById('stat-backlog').classList.toggle('danger', SIM.queue.length > capacity * 1.5);

    if (SIM.closedRing.length) {
      const avgCycle = SIM.closedRing.reduce((a, b) => a + b.elapsed, 0) / SIM.closedRing.length;
      const withinSLA = SIM.closedRing.filter(c => c.elapsed <= SLA_DAYS).length / SIM.closedRing.length;
      document.getElementById('sv-cycle').textContent = avgCycle.toFixed(1) + 'd';
      const slaPct = Math.round(withinSLA * 100);
      const slaEl = document.getElementById('sv-sla');
      slaEl.textContent = slaPct + '%';
      document.getElementById('stat-sla').classList.toggle('good', slaPct >= 90);
      document.getElementById('stat-sla').classList.toggle('danger', slaPct < 60);
    } else {
      document.getElementById('sv-cycle').textContent = '–';
      document.getElementById('sv-sla').textContent = '–';
    }

    // Utilization = required concurrent capacity (λ × avg dwell, i.e. Little's Law WIP) ÷ capacity actually provided.
    const util = (lambda * avgDwell) / capacity;
    document.getElementById('util-pct').textContent = Math.round(util * 100) + '%';
    const fill = document.getElementById('util-fill');
    fill.style.width = Math.min(100, util * 100) + '%';
    fill.style.background = util > 1 ? 'var(--critical)' : (util > 0.75 ? 'var(--warn)' : 'var(--good)');

    // Sparkline
    const spark = document.getElementById('spark');
    const hist = SIM.backlogHistory;
    const max = Math.max(1, ...hist);
    spark.innerHTML = '';
    hist.forEach(v => {
      const bar = document.createElement('div');
      bar.className = 'spark-bar' + (v > capacity ? ' over' : '');
      bar.style.height = Math.max(2, (v / max) * 62) + 'px';
      spark.appendChild(bar);
    });

    // Queue visualization
    const qv = document.getElementById('qv-track');
    qv.innerHTML = '';
    if (SIM.day === 0) {
      qv.innerHTML = '<div class="qv-empty">Press ▶ Run to start the simulation.</div>';
    } else if (SIM.queue.length === 0) {
      qv.innerHTML = '<div class="qv-empty">Queue is empty. Every case has cleared.</div>';
    } else {
      const showCount = Math.min(SIM.queue.length, 90);
      for (let i = 0; i < showCount; i++) {
        const d = document.createElement('div');
        d.className = 'qv-dot' + (i >= capacity ? ' wait' : '');
        qv.appendChild(d);
      }
      if (SIM.queue.length > showCount) {
        const more = document.createElement('div');
        more.className = 'qv-more';
        more.textContent = '+' + (SIM.queue.length - showCount) + ' more';
        qv.appendChild(more);
      }
    }
  }

  function simStart() {
    if (SIM.running) return;
    SIM.running = true;
    document.getElementById('sim-alert').classList.remove('show');
    document.getElementById('sim-run').disabled = true;
    document.getElementById('sim-pause').disabled = false;
    SIM.timer = setInterval(simTick, 110);
  }
  function simPause() {
    SIM.running = false;
    clearInterval(SIM.timer);
    document.getElementById('sim-run').disabled = false;
    document.getElementById('sim-pause').disabled = true;
  }
  function simReset() {
    simPause();
    SIM.day = 0; SIM.queue = []; SIM.closedRing = []; SIM.backlogHistory = []; SIM.rngState = 42;
    document.getElementById('sim-alert').classList.remove('show');
    simRender();
  }
  ['sw-surge','sw-a','sw-b','sw-c'].forEach(id => {
    document.getElementById(id).addEventListener('change', simRender);
  });
  simRender();
<\/script>
